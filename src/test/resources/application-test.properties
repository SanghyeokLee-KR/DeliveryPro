spring.application.name=DeliveryPro

# Oracle Database for integration tests
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# External integration placeholders for test context loading
spring.mail.username=test@example.com
spring.mail.password=test-mail-password
ipify.api.url=http://localhost
naver.client.id=test-naver-client-id
naver.client.secret=test-naver-client-secret
google.client.id=test-google-client-id
google.client.secret=test-google-client-secret
kakao.client.id=test-kakao-client-id
kakao.client.secret=test-kakao-client-secret
kakao.api.key=test-kakao-api-key
kakao.javascript.key=test-kakao-javascript-key
