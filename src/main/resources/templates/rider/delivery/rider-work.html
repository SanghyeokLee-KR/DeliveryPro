<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>라이더 배달 서비스</title>
    <!-- CSS 파일들 -->
    <link rel="stylesheet" href="/layout/rider/css/delivery-header.css"/>
    <link rel="stylesheet" href="/layout/rider/css/delivery-sidebar.css"/>
    <link rel="stylesheet" href="/rider/css/rider-management.css"/>
    <link rel="stylesheet" href="/rider/css/main.css"/>
    <link rel="shortcut icon" href="/favicon-3.ico" type="image/x-icon"/>
    <style>
        /* 지도 위 액션버튼 등 */
        .segment-info {
            font-weight: bold;
            margin-left: 5px;
        }
        .map-action-btn {
            background-color: #FFA500;
            color: #fff;
            padding: 5px 10px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            margin: 0 5px;
        }
        .map-action-btn.disabled {
            background-color: #A9A9A9;
            cursor: default;
        }
        .auto-follow-container {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 999;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        /* 금액 표시용(거리 덮어쓰기 방지) */
        .price-info {
            font-weight: bold;
            text-align: right;
            display: inline-block;
            min-width: 60px;
            white-space: nowrap;
            margin-left: 5px;
        }
    </style>
</head>
<body>
<!-- 헤더 영역 (Thymeleaf 삽입) -->
<header class="header" th:insert="~{layout/rider/delivery/delivery-header :: deliveryheaderContent}"></header>

<!-- 메인 레이아웃 컨테이너 -->
<div class="main-container">
    <!-- 사이드바 영역 (Thymeleaf fragment 삽입) -->
    <aside class="sidebar" th:insert="~{layout/rider/delivery/delivery-sidebar :: deliverysidebarContent}"></aside>

    <!-- 자동 팔로우 토글 UI -->
    <div class="auto-follow-container">
        <label>
            <input type="checkbox" id="autoFollowToggle" checked/>
            자동 팔로우
        </label>
    </div>

    <!-- 메인 콘텐츠 영역 -->
    <main class="main-content">
        <!-- 라이더 출발 좌표. 서버가 riders 테이블에서 읽어 내려준다 -->
        <div id="riderOrigin" hidden
             th:attr="data-lon=${riderLon},data-lat=${riderLat}"></div>
        <!-- 지도 표시 영역 -->
        <div id="main_map"></div>
        <!-- 거리/소요시간 및 액션 버튼 표시 영역 -->
        <div id="distanceInfoSidebar" style="padding:10px; font-size:16px;"></div>
    </main>
</div>

<!-- 카카오 지도 SDK (appkey 포함) -->
<script th:src="@{https://dapi.kakao.com/v2/maps/sdk.js(appkey=${@environment.getProperty('kakao.javascript.key')},libraries='services')}" type="text/javascript"></script>
<!-- SDK 가 뜨지 않았을 때만 같은 이름의 축소 구현을 채워 넣는다. SDK 바로 다음이어야 한다 -->
<script src="/rider/js/demo-map-fallback.js"></script>
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4="
        crossorigin="anonymous"></script>
<!-- 분리된 자바스크립트 파일 (haversine_formula.js) -->
<script src="/rider/js/haversine_formula.js"></script>
<script>
    function unwrapApiResponse(body) {
        if (body && typeof body === "object" && body.success !== undefined && body.data !== undefined) {
            return body.data;
        }
        return body;
    }

    /////////////////////////////////////////////////////////////
    // (참고용) 콜 타임 포맷팅 함수
    function formatCallTime(callTime) {
        if (!callTime) return "null";
        let date = new Date(callTime.replace(/-/g, '/'));
        let year = date.getFullYear();
        let month = String(date.getMonth() + 1).padStart(2, '0');
        let day = String(date.getDate()).padStart(2, '0');
        let hour = String(date.getHours()).padStart(2, '0');
        let min = String(date.getMinutes()).padStart(2, '0');
        let sec = String(date.getSeconds()).padStart(2, '0');
        return `${year}-${month}-${day} ${hour}:${min}:${sec}`;
    }
    /////////////////////////////////////////////////////////////
    // 자동 팔로우 여부 플래그
    let autoFollow = true;
    // 이번 배차의 정차지 전체. 팔로우를 끌 때 지도를 여기에 맞춘다.
    let routeBounds = null;
    $(function () {
        $('#autoFollowToggle').on('change', function () {
            autoFollow = $(this).is(':checked');
            // 팔로우를 끄는 것은 코스 전체를 보겠다는 뜻이다. 라이더를 따라가던 화면이
            // 그 자리에 멈추기만 하면 목적지 대부분이 화면 밖에 남는다.
            if (!autoFollow && routeBounds && typeof map1 !== "undefined" && map1) {
                map1.setBounds(routeBounds);
            }
        });
    });

    // 라이더 출발점, 매장, 배달지를 모두 담는 경계를 만들어 둔다.
    function rememberRouteBounds(points) {
        let valid = (points || []).filter(p => p && isFinite(p.x) && isFinite(p.y));
        if (valid.length < 2) return;
        let bounds = new kakao.maps.LatLngBounds();
        valid.forEach(p => bounds.extend(new kakao.maps.LatLng(p.y, p.x)));
        routeBounds = bounds;
    }
    /////////////////////////////////////////////////////////////
    // 주소 정리: 앞쪽 숫자(지번) 제거
    function cleanAddress(address) {
        if (typeof address !== "string") {
            address = address.address || address.toString();
        }
        let parts = address.trim().split(/\s+/);
        if (parts.length > 0 && /^\d+$/.test(parts[0])) {
            parts.shift();
        }
        return parts.join(" ");
    }
    /////////////////////////////////////////////////////////////
    // KakaoGeocoderUtil (지오코딩 + 최적화)
    const KakaoGeocoderUtil = {
        geocodeAddress: function (address, callback) {
            if (typeof address !== "string") {
                address = address.address || "";
            }
            let cleanedAddress = cleanAddress(address);
            console.log("[KakaoGeocoderUtil] 정제된 주소:", cleanedAddress);
            let geocoder = new kakao.maps.services.Geocoder();
            geocoder.addressSearch(cleanedAddress, function (result, status) {
                if (status === kakao.maps.services.Status.OK) {
                    let coords = {x: result[0].x, y: result[0].y};
                    console.log("[KakaoGeocoderUtil] 좌표:", coords);
                    callback(coords);
                    return;
                }
                console.warn("[KakaoGeocoderUtil] 주소 검색 실패:", cleanedAddress);
                // 키가 막혀 지오코딩이 실패해도 배차와 경로 흐름은 이어져야 한다.
                if (window.DemoGeocoder) {
                    window.DemoGeocoder.locate(cleanedAddress, callback);
                    return;
                }
                callback(null);
            });
        },
        geocodeAddresses: function (addresses, callback) {
            let addressStrings = addresses.map(addr =>
                (typeof addr === "string") ? addr : (addr.address || ""));
            let results = new Array(addressStrings.length).fill(null);
            let count = addressStrings.length;
            if (count === 0) {
                callback(results);
                return;
            }
            // 성공한 개수가 아니라 끝난 개수를 센다. 성공만 세면 주소 하나가 실패했을 때
            // 콜백이 영영 불리지 않아 경로 계산 자체가 시작되지 않는다.
            let finished = 0;
            addressStrings.forEach(function (addr, idx) {
                KakaoGeocoderUtil.geocodeAddress(addr, function (coords) {
                    results[idx] = coords || null;
                    finished++;
                    if (finished === count) {
                        console.log("[KakaoGeocoderUtil] 모든 주소의 좌표:", results);
                        callback(results);
                    }
                });
            });
        },
        // 방문 순서 계산은 서버가 한다. 화면에서 직선 거리로 다시 정하면
        // 서버가 저장한 order_sequence 와 화면에 그려지는 순서가 어긋난다.
        planRoute: function (start, destinations, callback) {
            $.ajax({
                url: "/rider/route/plan",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify({start: start, destinations: destinations}),
                dataType: "json",
                success: function (response) {
                    callback(unwrapApiResponse(response));
                },
                error: function (xhr) {
                    console.error("[RoutePlan] 경로 계획 실패", xhr && xhr.status);
                    callback(null);
                }
            });
        }
    };
    /////////////////////////////////////////////////////////////
    // 지도, 마커, 경로 변수
    let map1;
    let polylines = [];
    let riderOverlays = [];
    // 출발 좌표는 서버가 라이더 레코드에서 읽어 내려준다.
    const riderOriginEl = document.getElementById("riderOrigin");
    const driverX = Number(riderOriginEl.dataset.lon);
    const driverY = Number(riderOriginEl.dataset.lat);
    let storeMarker = null;
    let actionOverlay = null;
    const segmentColors = ["#FF0000", "#0000FF", "#00AA00", "#FFA500"];
    /////////////////////////////////////////////////////////////
    // 배달 데이터 전역
    let groupDeliveryData = [];
    let singleDeliveryData = [];
    /////////////////////////////////////////////////////////////
    // 각 카드 거리 업데이트 (매장→고객, 고객→고객)
    function updateCardDistance($card) {
        let storeAddr = $card.data("store-address");
        let customerAddrsData = $card.data("customer-addresses");
        let customerAddrs = (typeof customerAddrsData === "object") ?
            customerAddrsData : JSON.parse(customerAddrsData);
        // 매장 좌표
        KakaoGeocoderUtil.geocodeAddress(storeAddr, function (storeCoords) {
            if (!storeCoords) return;
            // 매장 ~ 라이더 거리
            $.ajax({
                url: "/calcDistance",
                type: "POST",
                data: {
                    fromX: driverX,
                    fromY: driverY,
                    toX: storeCoords.x,
                    toY: storeCoords.y
                },
                dataType: "json",
                success: function (response) {
                    response = unwrapApiResponse(response);
                    let distance = response.distance;
                    // data-seg-index="0" 만 업데이트
                    $card.find("span.segment-info[data-seg-index='0']").text(distance + "m");
                }
            });
            // 매장 ~ 첫 고객, 이후 고객 간 거리
            let prevCoord = storeCoords;
            customerAddrs.forEach(function (addr, index) {
                KakaoGeocoderUtil.geocodeAddress(addr, function (custCoords) {
                    if (!custCoords) return;
                    $.ajax({
                        url: "/calcDistance",
                        type: "POST",
                        data: {
                            fromX: prevCoord.x,
                            fromY: prevCoord.y,
                            toX: custCoords.x,
                            toY: custCoords.y
                        },
                        dataType: "json",
                        success: function (res) {
                            res = unwrapApiResponse(res);
                            let dist = res.distance;
                            // 매장 이후는 index 순서대로
                            let $customerSpan = $card.find("span.segment-info")
                                .not("[data-seg-index='0']")
                                .eq(index);
                            $customerSpan.text(dist + "m");
                            prevCoord = custCoords;
                        }
                    });
                });
            });
        });
    }
    function updateCardDistances() {
        $(".group-delivery-card").each(function () {
            updateCardDistance($(this));
        });
    }
    /////////////////////////////////////////////////////////////
    // 페이지 로드 시
    $(function () {
        initMap();
        // 탭 전환 (예제용)
        $("input[name='delivery-status']").on('change', function () {
            let val = $(this).val();
            if (val === "배차") {
                $("#tab-batcha, #tab-batcha2, #tab-jinhaeng, #tab-done").hide();
                $("#tab-batcha, #tab-batcha2").show();
            } else if (val === "진행중") {
                $("#tab-batcha, #tab-batcha2").hide();
                $("#tab-jinhaeng").show();
                $("#tab-done").hide();
            } else {
                $("#tab-batcha, #tab-batcha2, #tab-jinhaeng").hide();
                $("#tab-done").show();
            }
        });
        $("input[name='delivery-status']:checked").trigger("change");
        // 주문 목록 AJAX 호출 (서버에서 JSON 데이터 받음)
        $.ajax({
            url: "/orders/riderOrderList",
            type: "POST",
            dataType: "json",
            success: function (res) {
                res = unwrapApiResponse(res);
                console.log("[riderOrderList] result=", res);
                renderGroupDelivery(res);
                renderSingleDelivery(res);
                updateCardDistances();
            },
            error: function (err) {
                console.error("[riderOrderList] Ajax Error:", err);
            }
        });
        // 수락 버튼 클릭 (그룹 및 단일 배달 모두 처리)
        $(document).on("click", ".delivery-action", function () {
            let $card = $(this).closest(".group-delivery-card");
            console.log("주문 li 요소들:", $card.find("li[data-order-id]"));
            // 그룹 배달인 경우 data-delivery-ids 속성이 존재
            let deliveryIds = $card.data("delivery-ids");
            if (deliveryIds) {
                $.ajax({
                    url: '/api/delivery/accept',
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ deliveryIds: deliveryIds }),
                    dataType: 'json',
                    success: function(response) {
                        response = unwrapApiResponse(response);
                        console.log("수락 성공:", response);
                        $card.appendTo("#inProgressBox");
                        $card.find(".delivery-action").remove();

                        $("input[name='delivery-status'][value='진행중']")
                            .prop("checked", true)
                            .trigger("change");

                        preloadRoute($card);
                    },
                    error: function(err) {
                        console.error("수락 실패:", err);
                        alert("배달 수락에 실패하였습니다.");
                    }
                });
            } else {
                // 단일 배달인 경우 (간단히 처리)
                $.ajax({
                    url: '/api/delivery/accept', // 단일 배달도 같은 엔드포인트에서 처리 가능하도록 구성
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ deliveryIds: [$card.attr("id")] }),
                    dataType: 'json',
                    success: function(response) {
                        response = unwrapApiResponse(response);
                        console.log("수락 성공:", response);
                        $card.appendTo("#inProgressBox");
                        $card.find(".delivery-action").remove();
                        preloadRoute($card);
                    },
                    error: function(err) {
                        console.error("수락 실패:", err);
                        alert("배달 수락에 실패하였습니다.");
                    }
                });
            }
        });
        // 정렬 select -> "보기" 클릭 (예제)
        $("#view-button").on("click", function () {
            const criteria = $("#sort-select").val();
            sortGroupData(criteria);
            sortSingleData(criteria);
        });
    });
    /////////////////////////////////////////////////////////////
    // 지도 초기화
    function initMap() {
        map1 = new kakao.maps.Map(document.getElementById('main_map'), {
            center: new kakao.maps.LatLng(driverY, driverX),
            level: 3
        });
        // 라이더 오버레이
        let riderDiv = document.createElement("div");
        riderDiv.id = "riderOverlay-" + Date.now();
        riderDiv.style.width = "80px";
        riderDiv.style.height = "38px";
        riderDiv.style.backgroundImage = "url('/rider/img/car.png')";
        riderDiv.style.backgroundSize = "contain";
        riderDiv.style.backgroundPosition = "center";
        riderDiv.style.backgroundRepeat = "no-repeat";
        riderDiv.style.position = "absolute";
        riderDiv.style.transform = "rotate(0deg)";
        riderDiv.style.zIndex = "100";
        riderDiv.style.pointerEvents = "none";
        let newRiderOverlay = new kakao.maps.CustomOverlay({
            position: new kakao.maps.LatLng(driverY, driverX),
            content: riderDiv,
            yAnchor: 0.5,
            xAnchor: 0.5
        });
        newRiderOverlay.setMap(map1);
        riderOverlays.push(newRiderOverlay);
    }
    /////////////////////////////////////////////////////////////
    // 경로 프리로드
    function preloadRoute($card) {
        const storeAddr = $card.data("store-address");
        let customerAddrsData = $card.data("customer-addresses");
        if (!customerAddrsData) return;
        const customerAddrs = (typeof customerAddrsData === "object")
            ? customerAddrsData
            : JSON.parse(customerAddrsData);
        KakaoGeocoderUtil.geocodeAddress(storeAddr, function (storeCoords) {
            if (!storeCoords) return;
            addStoreMarker(storeCoords.x, storeCoords.y);
            let customerAddrStrs = customerAddrs.map(item =>
                (typeof item === "string") ? item : (item.address || "")
            );
            KakaoGeocoderUtil.geocodeAddresses(customerAddrStrs, function (customerCoordsArray) {
                // 좌표가 겹치는 배달지를 지우면 정차지 수가 주문 수보다 줄어 아래 구간 처리에서
                // 주문과 구간이 밀린다. 자리를 그대로 두고 순서만 서버가 정하게 한다.
                customerCoordsArray.forEach(function (coord, idx) {
                    if (coord) {
                        addCustomerMarker(coord.x, coord.y, customerAddrStrs[idx]);
                    }
                });
                KakaoGeocoderUtil.planRoute(storeCoords, customerCoordsArray, function (plan) {
                    let visitOrder = (plan && plan.order && plan.order.length)
                        ? plan.order
                        : customerCoordsArray.map((coord, idx) => idx);
                    // 구간 경로는 순서와 같은 계산에서 나온다. 배달지 인덱스로 찾아 두어야
                    // 방문 순서와 화면에 그리는 선이 어긋나지 않는다.
                    let legByDestination = {};
                    if (plan && plan.legs) {
                        plan.legs.forEach(function (leg) {
                            legByDestination[leg.destinationIndex] = leg;
                        });
                    }
                    let routeStops = visitOrder
                        .filter(idx => customerCoordsArray[idx])
                        .map(idx => ({
                            orderIndex: idx,
                            point: customerCoordsArray[idx],
                            leg: legByDestination[idx] || null
                        }));
                    showRoutePlanSummary(plan, routeStops.length);
                    rememberRouteBounds([{x: driverX, y: driverY}, storeCoords]
                        .concat(routeStops.map(s => s.point)));
                    // 픽업 구간은 계획에 없다. 라이더에서 매장까지만 따로 계획해 대체 경로를 얻는다.
                    KakaoGeocoderUtil.planRoute({x: driverX, y: driverY}, [storeCoords], function (pickupPlan) {
                        let pickupLeg = (pickupPlan && pickupPlan.legs && pickupPlan.legs.length)
                            ? pickupPlan.legs[0]
                            : null;
                        requestRouteAndAnimate(driverX, driverY, storeCoords.x, storeCoords.y, "#FF0000",
                            pickupLeg ? pickupLeg.path : null, function () {
                                console.log("매장 도착! 이후 고객 구간");
                                // 매장에 해당하는 첫 번째 segment-info(픽업 정보)를 "픽업완료"로 업데이트
                                $card.find("span.segment-info[data-seg-index='0']").text("픽업완료");
                                // 매장 도착 후 고객 구간 처리를 시작 (여기서부터는 집(배달) 구간)
                                processRouteSegments(storeCoords, routeStops, $card);
                            });
                    });
                });
            });
        });
    }
    // 서버 계획의 좌표열({x, y})과 카카오 응답을 같은 형태로 맞춘다.
    function toLatLngPath(points) {
        if (!points) {
            return [];
        }
        return points.map(point => new kakao.maps.LatLng(point.y, point.x));
    }
    function kakaoRouteCoords(routeResult) {
        let coords = [];
        if (routeResult && routeResult.segments) {
            routeResult.segments.forEach(function (segment) {
                (segment.coords || []).forEach(function (point) {
                    coords.push(point);
                });
            });
        }
        return coords;
    }
    // 경로 요청 + 폴리라인 + 애니메이션
    // 카카오 응답을 먼저 쓴다. 실제 도로 데이터가 서버의 합성 도로망보다 촘촘해서다.
    // 키가 없거나 구간이 비어 돌아오면 서버가 계산한 구간 경로로 대체한다.
    function requestRouteAndAnimate(fromX, fromY, toX, toY, color, fallbackPath, onFinish) {
        function drawAndAnimate(path) {
            if (!path || path.length < 2) {
                console.warn("[requestRouteAndAnimate] 그릴 좌표가 없어 구간을 건너뜁니다.");
                if (onFinish) onFinish();
                return;
            }
            drawPathOnMap(path, color);
            animatePath(path, onFinish);
        }
        $.ajax({
            url: '/pointAjax',
            type: 'POST',
            data: {fromX, fromY, toX, toY},
            dataType: 'json',
            success: function (routeResult) {
                routeResult = unwrapApiResponse(routeResult);
                let path = toLatLngPath(kakaoRouteCoords(routeResult));
                drawAndAnimate(path.length >= 2 ? path : toLatLngPath(fallbackPath));
            },
            error: function (err) {
                console.error("[requestRouteAndAnimate] 경로 오류:", err);
                drawAndAnimate(toLatLngPath(fallbackPath));
            }
        });

    // 서버가 계산한 경로 요약. 화면에 숫자가 남아야 방문 순서 계산이 돌았다는 것이 보인다.
    function showRoutePlanSummary(plan, stopCount) {
        if (!plan) {
            $("#distanceInfoSidebar").text("경로 계획을 받지 못했습니다.");
            return;
        }
        let km = (plan.totalMeters / 1000).toFixed(2);
        let minutes = Math.ceil(plan.totalSeconds / 60);
        let quality = plan.exact ? "정확해" : "근사해";
        $("#distanceInfoSidebar").text(
            `서버 경로 계획: 배달지 ${stopCount}곳 · 총 ${km}km · 약 ${minutes}분 · 방문 순서 ${quality}`);

    // 라이더 아이콘 애니메이션
    function animatePath(path, onFinish) {
        if (riderOverlays.length < 1) return;
        let myRiderOverlay = riderOverlays[riderOverlays.length - 1];
        let idx = 0, fraction = 0;
        function step() {
            if (idx >= path.length - 1) {
                if (onFinish) onFinish();
                return;
            }
            if (fraction >= 1.0) {
                fraction = 0;
                idx++;
                if (idx >= path.length - 1) {
                    if (onFinish) onFinish();
                    return;
                }
            }
            let start = path[idx], end = path[idx + 1];
            if (!end) {
                if (onFinish) onFinish();
                return;
            }
            let lat = start.getLat() + (end.getLat() - start.getLat()) * fraction;
            let lng = start.getLng() + (end.getLng() - start.getLng()) * fraction;
            let currentPos = new kakao.maps.LatLng(lat, lng);
            myRiderOverlay.setPosition(currentPos);
            if (autoFollow) map1.setCenter(currentPos);
            let angle = calculateBearing(start, end);
            angle = (angle - 90 + 360) % 360;
            let riderElem = myRiderOverlay.getContent();
            if (riderElem) {
                riderElem.style.transform = `rotate(${angle}deg)`;
            }
            fraction += 0.02;
            requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
    }
    // 구간별 애니메이션
    // 각 구간별 애니메이션 처리 (수정된 부분)
    function processRouteSegments(startPoint, routeStops, $card) {
        let currentPoint = startPoint;
        function processNextSegment(index) {
            if (index >= routeStops.length) {
                // 모든 고객 구간을 완료하면 최종 배달완료 버튼 표시
                showFinalDeliveryCompleteButton($card);
                return;
            }
            let nextPoint = routeStops[index].point;
            let legPath = routeStops[index].leg ? routeStops[index].leg.path : null;
            showActionButtonOnMap("배달", function () {
                requestRouteAndAnimate(
                    currentPoint.x, currentPoint.y,
                    nextPoint.x, nextPoint.y,
                    "#0000FF", legPath, function () {
                        // 방문 순서와 카드의 주문 나열 순서는 다르다. 원래 자리를 가리키는
                        // orderIndex 로 찾아야 엉뚱한 주문이 배달완료로 바뀌지 않는다.
                        let $orderLi = $card.find("li[data-order-id]").eq(routeStops[index].orderIndex);
                        if ($orderLi.length > 0) {
                            let orderId = $orderLi.data('order-id');
                            console.log("도착 후 처리할 orderId:", orderId);
                            if (orderId) {
                                let $segmentSpan = $orderLi.find("span.segment-info");
                                completeOrderSegment(orderId, $segmentSpan, "배달완료");
                            } else {
                                console.error("orderId is undefined at index", index);
                            }
                        } else {
                            console.warn("No order element found at index", index, ". Skipping completeOrderSegment.");
                        }
                        currentPoint = nextPoint;
                        processNextSegment(index + 1);
                    }
                );
            });
        }
        processNextSegment(0);
    }

    // 방위각 계산
    function calculateBearing(fromLatLng, toLatLng) {
        let lat1 = fromLatLng.getLat() * Math.PI / 180;
        let lon1 = fromLatLng.getLng() * Math.PI / 180;
        let lat2 = toLatLng.getLat() * Math.PI / 180;
        let lon2 = toLatLng.getLng() * Math.PI / 180;
        let y = Math.sin(lon2 - lon1) * Math.cos(lat2);
        let x = Math.cos(lat1) * Math.sin(lat2)
            - Math.sin(lat1) * Math.cos(lat2) * Math.cos(lon2 - lon1);
        let brng = Math.atan2(y, x) * 180 / Math.PI;
        return (brng + 360) % 360;
    }

                <li data-order-id="${o.orderId}">
                  <img src="/rider/img/icons/위치.svg" class="location-icon"/>
                  <span>${userAddr}</span>
                  <span class="segment-info" data-seg-index="1">--</span>
                </li>
                <li>
                  <img src="/rider/img/icons/user.svg" class="location-icon"/>
                  <span>[고객 요청 사항] ${msg}</span>
                  <span></span>
                </li>
                <li>
                  <img src="/rider/img/icons/card.svg" class="location-icon"/>
                  <span>카드결제 (완료)</span>
                  <span class="price-info">${o.orderTotalPrice ? o.orderTotalPrice + '원' : ''}</span>
                </li>
                <hr style="margin:8px 0;" />
                <li>
                  <img src="/rider/img/icons/delivery-fee.svg" class="location-icon"/>
                  <span>배달비</span>
                  <span class="price-info">${fee}원</span>
                </li>
              </ul>
            </div>
          </div>
        `;
        });
        $("#singleDeliveryBox").html(html);

        // 픽업시간 업데이트
        window.singleDeliveryData.forEach(function (o, idx) {
            // cardId는 백엔드에서 생성한 deliveryId가 있으면 그대로 사용,
            // 없으면 "single-" 접두어 없이 카운터값을 사용하도록 함.
            let cardId = (o.deliveryId !== null && o.deliveryId !== undefined)
                ? o.deliveryId
                : String(idx + 1).padStart(3, '0');
            let storeAddr = o.storeAddress || "매장주소없음";
            let baseTime = new Date();
            KakaoGeocoderUtil.geocodeAddress(storeAddr, function (storeCoords) {
                if (!storeCoords) {
                    $("#" + $.escapeSelector(cardId) + " .pickup-time").text("알 수 없음");
                    return;
                }
                let storeLatLng = new kakao.maps.LatLng(storeCoords.y, storeCoords.x);
                let riderLatLng = new kakao.maps.LatLng(driverY, driverX);
                let travelTimeMin = computeTravelTime(riderLatLng, storeLatLng);
                o.travelTime = travelTimeMin;
                baseTime.setMinutes(baseTime.getMinutes() + travelTimeMin);
                let pickupHour = baseTime.getHours().toString().padStart(2, '0');
                let pickupMin = baseTime.getMinutes().toString().padStart(2, '0');
                $("#" + $.escapeSelector(cardId) + " .pickup-time").text(`${pickupHour}:${pickupMin}`);
            });
        });
    }
    /////////////////////////////////////////////////////////////
    // 한집 배달 정렬
    function sortSingleData(criteria) {
        if (!window.singleDeliveryData || window.singleDeliveryData.length === 0) return;
        let sortedData = [];
        if (criteria === "distance") {
            sortedData = window.singleDeliveryData.slice().sort((a, b) => a.travelTime - b.travelTime);
        } else if (criteria === "fee") {
            sortedData = window.singleDeliveryData.slice().sort((a, b) => (b.deliveryFee || 0) - (a.deliveryFee || 0));
        } else if (criteria === "count") {
            sortedData = window.singleDeliveryData.slice(); // 한집은 1건씩이므로
        }
        renderSortedSingleDelivery(sortedData);
        updateCardDistances();
    }

            let deliveryId = String(deliveryIdCounter).padStart(3, '0');
            deliveryIdCounter++;
            let pickupTimePlaceholder = "계산중";
            html += `
          <div class="group-delivery-card"
               data-store-address="${storeAddr}"
               data-customer-addresses='["${userAddr}"]'
               id="single-${deliveryId}">
            <div class="delivery-header">

              <button class="delivery-action">수락</button>
            </div>
            <div class="delivery-details">

                <li data-order-id="${o.orderId}">

                  <span>${userAddr}</span>
                  <span class="segment-info" data-seg-index="1">--</span>
                </li>
                <li>
                  <img src="/rider/img/icons/user.svg" class="location-icon"/>
                  <span>[고객 요청 사항] ${msg}</span>
                  <span></span>
                </li>
                <li>
                  <img src="/rider/img/icons/card.svg" class="location-icon"/>
                  <span>카드결제 (완료)</span>
                  <span class="price-info">${o.orderTotalPrice ? o.orderTotalPrice + '원' : ''}</span>
                </li>
                <li>
                  <img src="/rider/img/icons/delivery-fee.svg" class="location-icon"/>
                  <span>배달비</span>

              </ul>

        });
        $("#singleDeliveryBox").html(html);
        data.forEach(function (o, idx) {
            let cardId = "single-" + String(idx + 1).padStart(3, '0');
            let storeAddr = o.storeAddress || "매장주소없음";
            let baseTime = new Date();
            KakaoGeocoderUtil.geocodeAddress(storeAddr, function (storeCoords) {
                if (!storeCoords) {
                    $("#" + $.escapeSelector(cardId) + " .pickup-time").text("알 수 없음");
                    return;
                }
                let storeLatLng = new kakao.maps.LatLng(storeCoords.y, storeCoords.x);
                let riderLatLng = new kakao.maps.LatLng(driverY, driverX);
                let travelTimeMin = computeTravelTime(riderLatLng, storeLatLng);
                o.travelTime = travelTimeMin;
                baseTime.setMinutes(baseTime.getMinutes() + travelTimeMin);
                let pickupHour = baseTime.getHours().toString().padStart(2, '0');
                let pickupMin = baseTime.getMinutes().toString().padStart(2, '0');
                $("#" + $.escapeSelector(cardId) + " .pickup-time").text(`${pickupHour}:${pickupMin}`);
            });
        });
    }
    /////////////////////////////////////////////////////////////
    // 경로 그리기
    function drawPathOnMap(path, polyColor) {
        let polyline = new kakao.maps.Polyline({
            path: path,
            strokeWeight: 5,
            strokeColor: polyColor,
            strokeOpacity: 0.8,
            strokeStyle: 'solid'
        });
        polyline.setMap(map1);
        polylines.push(polyline);
    }
    /////////////////////////////////////////////////////////////
    // 거리/시간 계산
    function computeTravelTime(fromLatLng, toLatLng) {
        const from = (typeof fromLatLng.getLat === "function")
            ? {lat: fromLatLng.getLat(), lng: fromLatLng.getLng()}
            : {lat: fromLatLng.lat, lng: fromLatLng.lng};
        const to = (typeof toLatLng.getLat === "function")
            ? {lat: toLatLng.getLat(), lng: toLatLng.getLng()}
            : {lat: toLatLng.lat, lng: toLatLng.lng};
        const distance = haversineDistance(from, to);
        const avgSpeed = 11.11; // m/s (예: 40km/h)
        const timeInSeconds = distance / avgSpeed;
        return Math.ceil(timeInSeconds / 60);
    }
