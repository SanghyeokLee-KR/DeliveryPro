# Oracle 없이 클론 즉시 실행하기 위한 데모 프로파일.
# 스키마는 엔티티에서 생성하고 데모 데이터는 DemoDataSeeder 가 넣는다.
# 실행: ./gradlew bootRun --args='--spring.profiles.active=h2'

spring.datasource.driver-class-name=org.h2.Driver
# 엔티티 6개가 columnDefinition 에 TRUNC(SYSDATE)·NVARCHAR2 를 직접 박아 두어
# 일반 모드에서는 member·orders·orderitem·boards·comments·login_history 생성이 실패한다.
spring.datasource.url=jdbc:h2:mem:deliverypro;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2

# 데모에서는 메일과 소셜 로그인을 쓰지 않는다. 자리표시자만 채워 기동을 막지 않게 한다.
MAIL_USERNAME=demo@example.com
MAIL_PASSWORD=demo
NAVER_CLIENT_ID=demo
NAVER_CLIENT_SECRET=demo
GOOGLE_CLIENT_ID=demo
GOOGLE_CLIENT_SECRET=demo
KAKAO_CLIENT_ID=demo
KAKAO_CLIENT_SECRET=demo
KAKAO_API_KEY=demo
KAKAO_JAVASCRIPT_KEY=demo

logging.level.com.icia.delivery=INFO
logging.level.jdk.httpclient=WARN
logging.level.org.hibernate.tool.schema=ERROR
